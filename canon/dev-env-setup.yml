topic: Development Environment Setup
environment: dev

procedure:
  - install-nvm
  - install-git
  - install-ides
  - install-vscode-extensions
  - install-mongodb
  - install-docker-desktop
  - install-utilities
  - configure-git
  - clone-project-repositories

install-nvm:
  primary-node-version: 24.21.0
  secondary-node-version:
    - version: 18.20.8
    - reason: used for a legacy service

install-git:
  version: 2.45.1

install-ides:
  - name: vscode
  - name: intellij

install-vscode-extensions:
  - name: ESLint
  - name: GitLens
  - name: Prettier

install-mongodb:
  version: 8.2.12
  additional:
    name: MongoDB Compass
    mention: Some may prefer DBeaver, but Compass is strongly recommended here

install-utilities:
  - name: docker-desktop
    version: 4.67.0

  - name: postman
    version: 11.2.0

configure-git:
  command: "git config --global <field> <value>"
  fields:
    - user.name
    - user.email
  mention: Make sure to use your company email here

whats-next:
  project-repositories:
    - name: dev-essentials
      url: https://github.com/sibyl-hub/dev-essentials.git
      branch: master
      description: Common docker containers used for all our projects

  useful-info:
    - name: helpme@itdesk.com
      desc: If you need any IT troubleshooting

    - name: http://faq.sibyl.totallyreal.com/
      desc: If you have any other questions, check the FAQ first!

mutations:
  - field: install-nvm.primary-node-version
    type: conflict
    variants: [22.23.3, 24.16.0]

  - field: install-utilities.docker-desktop.version
    type: conflict
    variants: [4.35.0, 4.37.2]

  - field: whats-next.project-repositories.dev-essentials.branch
    type: conflict
    variants: [main, dev/minified]

omissions:
  - field: install-ides.intellij
    reason: team uses vscode for entire environment

  - field: install-vscode-extensions.gitlens
    reason: team does not use

  - field: configure-git
    reason: forgot to include

  - field: install-nvm.secondary-node-version.reason
    reason: only include for "medium" and above detail-level

  - field: install-mongodb.additional.mention
    reason: only include for "thorough" style-level

  - field: configure-git.mention
    reason: forgot to mention

  - field: what's next
    reason: only include for "thorough" style-level
